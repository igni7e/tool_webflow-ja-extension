name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'  # v1.1.0 などのタグでトリガー

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dictionary
        run: python3 scripts/check_dict.py translation_terms.csv

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          if [ "v${MANIFEST_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "タグ ${GITHUB_REF_NAME} と manifest.json の version ${MANIFEST_VERSION} が一致しません"
            exit 1
          fi

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Create ZIP
        run: bash scripts/build.sh extension.zip

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
