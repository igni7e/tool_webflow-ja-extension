name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'  # v1.0.0 などのタグでトリガー

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # テストと用語集チェックに通らない版は公開しない
      - name: Run tests
        run: node --test

      - name: Verify dictionary is normalized
        run: |
          node scripts/build_dictionary.js
          git diff --exit-code translation_terms.csv

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "v${MANIFEST_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} と manifest.json の version ${MANIFEST_VERSION} が一致しません"
            exit 1
          fi

      - name: Create ZIP
        run: |
          zip -r extension.zip \
            manifest.json \
            src/constants.js \
            src/csv.js \
            src/translator.js \
            src/dom.js \
            src/content.js \
            translation_terms.csv \
            icon16.png \
            icon48.png \
            icon128.png \
            options.html \
            options.js \
            popup.html \
            popup.js \
            popup.css

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
